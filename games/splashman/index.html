<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Splashman is a kid-friendly mobile word guessing game with tap-to-talk voice input and guess-or-solve play.">
  <meta name="theme-color" content="#0e4570">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Splashman</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-app" id="gameApp" data-state="idle">
    <section class="panel play-panel" aria-labelledby="wordHeading">
      <div class="play-header">
        <div class="play-title-block">
          <a class="home-link home-link-inline" href="../../index.html">Back to Home</a>
          <p class="eyebrow eyebrow-play">Splashman</p>
          <h2 id="wordHeading">Keep Botsly Dry</h2>
          <p class="section-copy">
            Wrong guesses make Botsly more nervous.
          </p>
        </div>
        <div class="header-meta">
          <label class="category-picker" for="categorySelect">
            <span class="category-picker-label">Category</span>
            <select id="categorySelect" class="category-select" aria-label="Choose word category"></select>
          </label>
        </div>
        <div class="header-actions">
          <button class="action-button top-action" id="newGameButton" type="button" aria-label="New Game">
            <span class="action-label">New Game</span>
          </button>
          <button class="action-button action-button-secondary top-action" id="repeatButton" type="button" aria-label="Give Hint">
            <span class="action-label">Give Hint</span>
          </button>
        </div>
      </div>

      <div class="scene-card">
        <div class="scene-meta">
          <div>
            <p class="meter-label">Botsly Mood</p>
            <p class="mood-text" id="moodText"></p>
          </div>
          <div class="chance-pill" id="chanceText"></div>
        </div>

        <div class="stage-scene" id="stageScene" data-frame="1">
          <div class="cloud cloud-a"></div>
          <div class="cloud cloud-b"></div>
          <div class="cloud cloud-c"></div>
          <img class="botsly-sprite" id="botslySprite" alt="Botsly on the platform">
          <div class="platform-shadow"></div>
          <div class="platform"></div>
          <div class="water">
            <div class="wave wave-a"></div>
            <div class="wave wave-b"></div>
            <div class="wave wave-c"></div>
          </div>
        </div>
      </div>

      <div class="word-display" id="wordDisplay" aria-live="polite"></div>

      <div class="status-strip">
        <div class="wrong-card">
          <p class="meter-label">Miss Meter</p>
          <div class="mistake-meter" id="mistakeMeter" aria-live="polite"></div>
          <div class="wrong-guesses" id="wrongGuesses" aria-live="polite"></div>
        </div>

        <div class="message-card">
          <div class="card-head">
            <p class="meter-label">Coach</p>
            <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">Mute</button>
          </div>
          <p class="status-message" id="statusMessage" aria-live="polite"></p>
          <p class="transcript" id="lastTranscript" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section class="panel controls-panel">
      <div class="controls-grid">
        <div class="manual-panel">
          <div class="section-head section-head-tight">
            <div class="manual-title-row">
              <h2>Guess or Solve</h2>
              <button class="talk-button talk-button-inline" id="talkButton" type="button" aria-label="Tap to Talk">
                <span class="talk-button-icon" aria-hidden="true">Mic</span>
                <span class="talk-button-main">Tap to Talk</span>
                <span class="talk-button-sub">Speak</span>
              </button>
            </div>
          </div>

          <div class="manual-controls">
            <label class="sr-only" for="letterInput">Type a letter or the whole word</label>
            <input
              id="letterInput"
              class="letter-input"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Type a guess"
            >
            <button class="guess-button" id="guessButton" type="button">Guess</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="orientation-guard" aria-live="polite">
    <div class="orientation-guard-card">
      <img class="orientation-guard-botsly" src="assets/botsly/6.png" alt="Botsly looking worried">
      <p class="orientation-guard-title">Splashman works in portrait mode.</p>
      <p class="orientation-guard-copy">Please rotate your device upright to keep playing.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
